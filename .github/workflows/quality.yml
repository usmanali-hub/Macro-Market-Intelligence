name: Data Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macro-data-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m compileall src
      - run: python src/download_data.py
      - run: python src/clean_data.py
      - run: python src/analyze_macro.py
      - name: Upload generated macro charts
        uses: actions/upload-artifact@v6
        with:
          name: macro-market-charts
          path: outputs/charts/*.svg
          if-no-files-found: error
