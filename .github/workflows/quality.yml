name: Data Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m compileall src
      - run: python src/download_data.py
      - run: python src/clean_data.py
      - run: python src/analyze_macro.py
      - name: Publish generated macro charts
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f outputs/charts/*.svg
          if git diff --cached --quiet; then
            echo "No chart changes to commit."
          else
            git commit -m "Publish generated macro charts"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload generated macro charts
        uses: actions/upload-artifact@v4
        with:
          name: macro-market-charts
          path: outputs/charts/*.svg
          if-no-files-found: error
